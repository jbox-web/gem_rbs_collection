---
name: CI

permissions: {}

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'gems/**'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'gems/**'
  # Run workflow manually
  workflow_dispatch:

jobs:
  rubocop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Rubocop
        run: bin/rubocop

  rspec:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Run RSpec
        run: bin/rspec
